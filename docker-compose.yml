services:
  comiclens:
    build:
      context: .
    image: comiclens:local
    container_name: comiclens
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-8233}:8233"
    environment:
      COMICLENS_HOST: 0.0.0.0
      PORT: 8233
      COMICLENS_DATA_DIR: /app/data
      COMICLENS_CACHE_MAX_MB: ${COMICLENS_CACHE_MAX_MB:-5120}
      COMICLENS_ACCESS_PASSWORD: ${COMICLENS_ACCESS_PASSWORD:-}
      COMICLENS_UPSTREAM_BASE_URL: ${COMICLENS_UPSTREAM_BASE_URL:-https://manga18fx.com}
      COMICLENS_REQUEST_TIMEOUT: ${COMICLENS_REQUEST_TIMEOUT:-30}
      COMICLENS_LOG_LEVEL: ${COMICLENS_LOG_LEVEL:-INFO}
      COMICLENS_OCR_API_URL: ${COMICLENS_OCR_API_URL:-}
      COMICLENS_OCR_TOKEN: ${COMICLENS_OCR_TOKEN:-}
      COMICLENS_OCR_BASIC_USERNAME: ${COMICLENS_OCR_BASIC_USERNAME:-}
      COMICLENS_OCR_BASIC_PASSWORD: ${COMICLENS_OCR_BASIC_PASSWORD:-}
      COMICLENS_OCR_MODEL: ${COMICLENS_OCR_MODEL:-}
      COMICLENS_DEEPLX_URL: ${COMICLENS_DEEPLX_URL:-}
      COMICLENS_PROXY_URL: ${COMICLENS_PROXY_URL:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8233/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
