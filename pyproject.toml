[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comiclens"
version = "0.1.5"
description = "Self-hosted comic reader with progressive image translation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "little6neko", email = "little6carbon@163.com" },
]
dependencies = [
  "beautifulsoup4==4.13.4",
  "cryptography==45.0.5",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "lxml==5.4.0",
  "pillow==11.2.1",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
